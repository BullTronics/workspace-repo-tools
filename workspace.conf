# =============================================================================
# Workspace Configuration
# =============================================================================
# Display name shown in banners and terminal titles
WORKSPACE_NAME=My Workspace

# Interactive shell prompt prefix
WORKSPACE_PROMPT=workspace

# Relative directory (from this root) where repositories are cloned & managed
WORKSPACE_DIR=workspace

# =============================================================================
# Tooling Updater Configuration
# =============================================================================
# Upstream repository used by workspace-repo-tools-updater
TOOLS_UPSTREAM_URL=https://github.com/BullTronics/workspace-repo-tools.git
TOOLS_UPSTREAM_BRANCH=main
# Optional raw base URL override for VERSION checks (auto-derived for GitHub repos)
# TOOLS_RAW_BASE_URL=https://raw.githubusercontent.com/BullTronics/workspace-repo-tools/main

# Set to true to disable automatic update checks and banners
DISABLE_AUTO_UPDATE_CHECK=false

# Minimum hours between automatic background update checks
UPDATE_CHECK_INTERVAL_HOURS=24

