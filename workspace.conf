# =============================================================================
# Workspace Configuration
# =============================================================================
# Display name shown in banners and terminal titles
WORKSPACE_NAME=My Workspace

# Interactive shell prompt prefix
WORKSPACE_PROMPT=workspace

# Relative directory (from this root) where repositories are cloned & managed
WORKSPACE_DIR=workspace

# =============================================================================
# Workspace Tools Release & Auto-Update Configuration
# =============================================================================
# Pinned release version downloaded into .workspace-tools/library-bundle-<version>.*
TOOLS_VERSION=1.0.3

# Config schema version tracked for structural migration hints during updates
CONFIG_SCHEMA_VERSION=1

# Upstream repository hosting GitHub Releases
TOOLS_REPO_URL=https://github.com/BullTronics/workspace-repo-tools

# Optional custom release base URL override (replaces <TOOLS_REPO_URL>/releases)
# TOOLS_RELEASE_BASE_URL=

# Set to true to disable automatic throttled update checks and banners
DISABLE_AUTO_UPDATE_CHECK=false

# Minimum hours between automatic release update checks
UPDATE_CHECK_INTERVAL_HOURS=24
